<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Eritropoetina - Versão Completa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f8ff;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin: 15px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background: #2196F3;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #1976D2;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #545b62;
        }
        .resultado {
            background: #e8f4fd;
            padding: 20px;
            border-left: 4px solid #2196F3;
            margin: 20px 0;
            border-radius: 5px;
            display: none;
        }
        .alerta {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .alerta-critico {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .dose-correta {
            background: #d4edda;
            border-left: 4px solid #28a745;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .via-recomendada {
            background: #e8f4fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .info-sexo {
            background: #e8f4fd;
            border-left: 4px solid #17a2b8;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .estrategia {
            background: #d1ecf1;
            border-left: 4px solid #17a2b8;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .plano {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        #grupoGestacao {
            display: none;
            background: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        #grupoRecusa {
            display: none;
            background: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚺🚹 Calculadora de Eritropoetina - Versão Completa</h1>
        <p class="alerta">⚠️ <strong>ATENÇÃO:</strong> Este é um instrumento educacional. Sempre consulte a bula atualizada e protocolos institucionais.</p>
        
        <form id="formEritropoetina">
            <div class="form-group">
                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" name="peso" min="1" max="300" required placeholder="Ex: 70">
            </div>
            
            <div class="form-group">
                <label for="idade">Idade (anos):</label>
                <input type="number" id="idade" name="idade" min="0" max="120" required placeholder="Ex: 45">
            </div>
            
            <div class="form-group">
                <label for="sexo">Sexo Biológico:</label>
                <select id="sexo" name="sexo" required onchange="atualizarFormulario()">
                    <option value="homem">Homem</option>
                    <option value="mulher">Mulher</option>
                    <option value="gestante">Mulher Gestante</option>
                </select>
            </div>
            
            <div id="grupoGestacao">
                <div class="form-group">
                    <label for="trimestre">Trimestre de Gestação:</label>
                    <select id="trimestre" name="trimestre">
                        <option value="primeiro">1º Trimestre</option>
                        <option value="segundo">2º Trimestre</option>
                        <option value="terceiro">3º Trimestre</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="indicacao">Indicação Clínica:</label>
                <select id="indicacao" name="indicacao" required onchange="atualizarOpcoesVia()">
                    <option value="anemia_renal">Anemia Renal Crônica</option>
                    <option value="anemia_critica">Anemia Crítica (UTI/Paciente Hospitalizado)</option>
                    <option value="quimioterapia">Anemia em Quimioterapia</option>
                    <option value="falciforme">Doença Falciforme (USO RESTRITO)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="situacao">Situação do Paciente:</label>
                <select id="situacao" name="situacao" required onchange="atualizarOpcoesVia()">
                    <option value="ambulatorial">Paciente Ambulatorial</option>
                    <option value="hospitalizado">Paciente Hospitalizado</option>
                    <option value="hemodialise">Paciente em Hemodiálise</option>
                    <option value="dialise_peritoneal">Paciente em Diálise Peritoneal</option>
                    <option value="uti">Paciente em UTI</option>
                    <option value="crise_aguda">Em Crise Aguda (Falciforme)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="aceitaTransfusao">Paciente Aceita Transfusão?</label>
                <select id="aceitaTransfusao" name="aceitaTransfusao" required onchange="atualizarFormulario()">
                    <option value="sim">Sim</option>
                    <option value="nao">NÃO - Restrição Transfusional</option>
                </select>
            </div>
            
            <div id="grupoRecusa">
                <div class="form-group">
                    <label for="motivoRecusa">Motivo da Recusa de Transfusão:</label>
                    <select id="motivoRecusa" name="motivoRecusa">
                        <option value="religioso">Religioso (Testemunhas de Jeová)</option>
                        <option value="pessoal">Pessoal/Filosófico</option>
                        <option value="alergia">Alergia/Reação Prévia</option>
                        <option value="outro">Outro Motivo</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="observacoesRecusa">Observações sobre a Recusa:</label>
                    <textarea id="observacoesRecusa" name="observacoesRecusa" rows="3" placeholder="Documente consentimento informado, alternativas discutidas, etc."></textarea>
                </div>
            </div>
            
            <div class="form-group">
                <label for="via">Via de Administração:</label>
                <select id="via" name="via" required>
                    <option value="subcutanea">Subcutânea</option>
                    <option value="intravenosa">Intravenosa</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="ferro">Status de Ferro:</label>
                <select id="ferro" name="ferro" required>
                    <option value="insuficiente">Ferro Insuficiente</option>
                    <option value="adequado">Ferro Adequado</option>
                </select>
            </div>
            
            <button type="button" onclick="calcularDose()">Calcular Dose</button>
            <button type="button" onclick="limparFormulario()" class="btn-secondary">Limpar</button>
            <button type="button" onclick="preencherExemploCompleto()" class="btn-secondary">Exemplo Completo</button>
        </form>
        
        <div id="resultado" class="resultado"></div>
    </div>

    <script>
        function atualizarFormulario() {
            const sexo = document.getElementById('sexo').value;
            const aceitaTransfusao = document.getElementById('aceitaTransfusao').value;
            const grupoGestacao = document.getElementById('grupoGestacao');
            const grupoRecusa = document.getElementById('grupoRecusa');
            
            if (sexo === 'gestante') {
                grupoGestacao.style.display = 'block';
            } else {
                grupoGestacao.style.display = 'none';
            }
            
            if (aceitaTransfusao === 'nao') {
                grupoRecusa.style.display = 'block';
                document.body.style.backgroundColor = '#fff0f0';
            } else {
                grupoRecusa.style.display = 'none';
                document.body.style.backgroundColor = '#f0f8ff';
            }
            
            atualizarOpcoesVia();
        }
        
        function atualizarOpcoesVia() {
            const indicacao = document.getElementById('indicacao').value;
            const situacao = document.getElementById('situacao').value;
            const viaSelect = document.getElementById('via');
            
            viaSelect.innerHTML = '';
            
            let viaRecomendada = recomendarVia(indicacao, situacao);
            
            const opcaoSC = document.createElement('option');
            opcaoSC.value = 'subcutanea';
            opcaoSC.textContent = 'Subcutânea';
            if (viaRecomendada.via === 'subcutânea') {
                opcaoSC.selected = true;
            }
            
            const opcaoIV = document.createElement('option');
            opcaoIV.value = 'intravenosa';
            opcaoIV.textContent = 'Intravenosa';
            if (viaRecomendada.via === 'intravenosa') {
                opcaoIV.selected = true;
            }
            
            viaSelect.appendChild(opcaoSC);
            viaSelect.appendChild(opcaoIV);
        }
        
        function recomendarVia(indicacao, situacao) {
            if (indicacao === 'falciforme') {
                if (situacao === 'crise_aguda') {
                    return {
                        via: 'intravenosa',
                        justificativa: 'CONTRAINDICADO durante crise aguda - considerar apenas em situações específicas',
                        frequencia: 'NÃO RECOMENDADO',
                        observacao: '🚨 ALTO RISCO de complicações durante crise aguda'
                    };
                } else {
                    return {
                        via: 'subcutânea',
                        justificativa: 'Via preferencial para uso ambulatorial em casos selecionados',
                        frequencia: '3 vezes por semana',
                        observacao: 'Apenas em casos específicos com acompanhamento hematológico'
                    };
                }
            }
            
            if (indicacao === 'anemia_renal') {
                if (situacao === 'hemodialise') {
                    return {
                        via: 'intravenosa',
                        justificativa: 'Paciente em hemodiálise - via IV durante sessão dialítica',
                        frequencia: '3 vezes por semana',
                        observacao: 'Administrar no final da sessão de hemodiálise'
                    };
                } else {
                    return {
                        via: 'subcutânea',
                        justificativa: 'Paciente não dialítico ou em diálise peritoneal',
                        frequencia: '1-3 vezes por semana',
                        observacao: 'Via preferencial para tratamento ambulatorial'
                    };
                }
            }

            if (indicacao === 'anemia_critica') {
                if (situacao === 'uti' || situacao === 'hospitalizado') {
                    return {
                        via: 'intravenosa',
                        justificativa: 'Paciente crítico hospitalizado com acesso venoso',
                        frequencia: '1 vez por semana',
                        observacao: 'Esquema fixo de 40.000 U/semana'
                    };
                } else {
                    return {
                        via: 'subcutânea',
                        justificativa: 'Paciente estável ou em transição para ambulatório',
                        frequencia: '1 vez por semana',
                        observacao: 'Mesma eficácia com maior praticidade'
                    };
                }
            }

            if (indicacao === 'quimioterapia') {
                return {
                    via: 'subcutânea',
                    justificativa: 'Paciente ambulatorial em quimioterapia',
                    frequencia: '1 vez por semana ou 3 vezes por semana',
                    observacao: 'Prefere-se SC para maior comodidade do paciente'
                };
            }
        }
        
        function ajustarPorSexo(sexo, idade, trimestre) {
            const valoresReferencia = {
                homem: {
                    normal: '13.5-17.5 g/dL',
                    idoso: '12.0-16.0 g/dL',
                    alvoTerapeutico: '10-12 g/dL',
                    observacao: 'Homens geralmente têm maiores reservas de ferro'
                },
                mulher: {
                    normal: '12.0-15.5 g/dL',
                    preMenopausa: '12.0-15.5 g/dL',
                    posMenopausa: '12.0-15.0 g/dL',
                    alvoTerapeutico: '10-12 g/dL',
                    observacao: 'Considerar perdas menstruais e menor reserva de ferro'
                },
                gestante: {
                    primeiroTrimestre: '11.0-14.0 g/dL',
                    segundoTrimestre: '10.5-13.5 g/dL',
                    terceiroTrimestre: '10.0-13.0 g/dL',
                    alvoTerapeutico: '≥10.5 g/dL',
                    observacao: 'Anemia fisiológica da gestação. Cautela com eritropoetina.'
                }
            };

            const fatoresAjuste = {
                homem: { fator: 1.0, motivo: 'Dose padrão' },
                mulher: { fator: 1.1, motivo: 'Mulheres podem necessitar dose 10% maior devido a menores reservas' },
                gestante: { fator: 1.2, motivo: 'Gestantes podem necessitar dose 20% maior - diluição fisiológica' }
            };

            let referencia;
            if (sexo === 'gestante') {
                referencia = valoresReferencia.gestante[`${trimestre}Trimestre`];
            } else {
                referencia = idade > 65 ? valoresReferencia[sexo].idoso : valoresReferencia[sexo].normal;
            }

            return {
                referenciaHb: referencia,
                alvoTerapeutico: sexo === 'gestante' ? valoresReferencia.gestante.alvoTerapeutico : valoresReferencia[sexo].alvoTerapeutico,
                fatorDose: fatoresAjuste[sexo].fator,
                motivoAjuste: fatoresAjuste[sexo].motivo,
                observacaoSexo: valoresReferencia[sexo].observacao,
                consideracoesEspeciais: sexo === 'gestante' ? [
                    '🤰 Eritropoetina categoria C na gestação',
                    '🤰 Avaliar risco-benefício cuidadosamente',
                    '🤰 Preferir uso apenas se benefício superar risco',
                    '🤰 Monitorar pressão arterial rigorosamente',
                    '🤰 Considerar anemia ferropriva como primeira causa'
                ] : (sexo === 'mulher' ? [
                    '🚺 Avaliar perdas menstruais',
                    '🚺 Mulheres têm menor reserva de ferro',
                    '🚺 Considerar dosagem de ferritina regularmente',
                    '🚺 Avaliar necessidade de suplementação de ferro'
                ] : [
                    '🚹 Homens têm maior reserva de ferro',
                    '🚹 Menor risco de anemia ferropriva',
                    '🚹 Monitorar sobrecarga de ferro em terapia prolongada'
                ])
            };
        }
        
        function calcularDose() {
            const peso = parseFloat(document.getElementById('peso').value);
            const idade = parseInt(document.getElementById('idade').value);
            const sexo = document.getElementById('sexo').value;
            const trimestre = document.getElementById('trimestre').value;
            const indicacao = document.getElementById('indicacao').value;
            const aceitaTransfusao = document.getElementById('aceitaTransfusao').value;
            const situacao = document.getElementById('situacao').value;
            const via = document.getElementById('via').value;
            const ferro = document.getElementById('ferro').value;
            
            if (!peso || !idade) {
                alert('Por favor, preencha todos os campos obrigatórios.');
                return;
            }
            
            const ajusteSexo = ajustarPorSexo(sexo, idade, trimestre);
            const viaRecomendacao = recomendarVia(indicacao, situacao);
            
            let resultado;
            
            if (aceitaTransfusao === 'nao') {
                const motivoRecusa = document.getElementById('motivoRecusa').value;
                resultado = calcularPacienteSemTransfusao(peso, idade, indicacao, situacao, via, ferro, motivoRecusa, ajusteSexo);
            } else {
                if (indicacao === 'anemia_renal') {
                    resultado = calcularAnemiaRenal(peso, idade, via, situacao, ferro, ajusteSexo);
                } else if (indicacao === 'anemia_critica') {
                    resultado = calcularAnemiaCritica(peso, idade, via, situacao, ferro, ajusteSexo);
                } else if (indicacao === 'quimioterapia') {
                    resultado = calcularQuimioterapia(peso, idade, via, situacao, ferro, ajusteSexo);
                } else if (indicacao === 'falciforme') {
                    resultado = calcularAnemiaFalciforme(peso, idade, via, situacao, ferro, ajusteSexo);
                }
            }
            
            exibirResultado(resultado, peso, idade, situacao, aceitaTransfusao, ajusteSexo, viaRecomendacao);
        }
        
        function calcularPacienteSemTransfusao(peso, idade, indicacao, situacao, via, ferro, motivoRecusa, ajusteSexo) {
            const ALERTAS_CRITICOS = [
                '🚨 PACIENTE COM RESTRIÇÃO A TRANSFUSÃO - ESTRATÉGIA CRÍTICA',
                '🚨 Nível de Hb alvo deve ser mantido MAIS ALTO (10-11 g/dL)',
                '🚨 Monitorização LABORATORIAL MAIS FREQUENTE',
                '🚨 Risco de anemia grave irreversível',
                '🚨 Considerar alternativas: ferro IV, ácido fólico, vit B12',
                '🚨 Planejar estratégia para sangramentos agudos'
            ];

            let dose, frequencia, observacoes, doseTotal;

            if (indicacao === 'anemia_renal') {
                dose = `${(75 * ajusteSexo.fatorDose).toFixed(0)}-${(125 * ajusteSexo.fatorDose).toFixed(0)} U/kg`;
                doseTotal = `${(peso * 100 * ajusteSexo.fatorDose).toFixed(0)} U (média)`;
                frequencia = '3 vezes por semana';
                observacoes = 'Dose ligeiramente aumentada para manter reserva hematológica adequada';
                
            } else if (indicacao === 'anemia_critica') {
                dose = 'ESQUEMA FIXO COM MONITORIZAÇÃO REFORÇADA';
                doseTotal = '40.000 U';
                frequencia = '1 vez por semana + hemograma 2x/semana';
                observacoes = 'Paciente crítico sem opção de transfusão - monitorização intensiva';
                
            } else if (indicacao === 'falciforme') {
                dose = `${(100 * ajusteSexo.fatorDose).toFixed(0)}-${(150 * ajusteSexo.fatorDose).toFixed(0)} U/kg`;
                doseTotal = `${(peso * 125 * ajusteSexo.fatorDose).toFixed(0)} U`;
                frequencia = '3 vezes por semana + hemograma 2x/semana';
                observacoes = 'Risco duplo - doença falciforme + sem transfusão. EXTREMO CUIDADO';
                
            } else {
                dose = `${(75 * ajusteSexo.fatorDose).toFixed(0)}-${(125 * ajusteSexo.fatorDose).toFixed(0)} U/kg`;
                doseTotal = `${(peso * 100 * ajusteSexo.fatorDose).toFixed(0)} U`;
                frequencia = '3 vezes por semana';
                observacoes = 'Estratégia conservadora mas com monitorização reforçada';
            }

            return {
                titulo: `PACIENTE QUE NÃO ACEITA TRANSFUSÃO - ${motivoRecusa.toUpperCase()}`,
                dose: dose,
                doseTotal: doseTotal,
                frequencia: frequencia,
                observacoes: observacoes,
                alvoHb: '10-11 g/dL (MARGEM DE SEGURANÇA)',
                ajuste: 'AJUSTE IMEDIATO se Hb < 10 g/dL. MANTER RESERVA HEMATOLÓGICA.',
                via: via,
                alertasCriticos: ALERTAS_CRITICOS,
                estrategiasAlternativas: [
                    '✅ Ferro intravenoso de alta dose',
                    '✅ Ácido fólico 5 mg/dia',
                    '✅ Vitamina B12 se deficiência',
                    '✅ Eritropoetina em dose de resgate se Hb < 8 g/dL',
                    '✅ Considerar agentes estimuladores de eritropoese de nova geração',
                    '✅ Otimização nutricional: proteínas, ferro, vitaminas'
                ],
                planoContingencia: [
                    '📋 Hemograma 2-3x/semana inicialmente',
                    '📋 Ferro sérico e saturação weekly',
                    '📋 Protocolo de ação rápida se Hb < 8 g/dL',
                    '📋 Contato direto com hematologista 24h',
                    '📋 Documentar consentimento informado específico',
                    '📋 Plano para sangramento agudo: agentes antifibrinolíticos'
                ],
                criteriosInternacao: [
                    '🏥 Hb < 8 g/dL com sintomas',
                    '🏥 Queda > 2 g/dL em 24h',
                    '🏥 Sangramento ativo',
                    '🏥 Instabilidade hemodinâmica',
                    '🏥 Necessidade de procedimento invasivo'
                ],
                ajusteSexo: ajusteSexo
            };
        }
        
        function calcularAnemiaRenal(peso, idade, via, situacao, ferro, ajusteSexo) {
            let doseMin, doseMax, frequencia, observacoes;
            
            if (via === 'subcutanea') {
                doseMin = 50 * ajusteSexo.fatorDose;
                doseMax = 100 * ajusteSexo.fatorDose;
                frequencia = situacao === 'hemodialise' ? '3 vezes por semana' : '1-3 vezes por semana';
                observacoes = 'Via preferencial para pacientes em diálise peritoneal ou tratamento conservador.';
            } else {
                doseMin = 25 * ajusteSexo.fatorDose;
                doseMax = 100 * ajusteSexo.fatorDose;
                frequencia = '3 vezes por semana';
                observacoes = 'Via indicada para pacientes em hemodiálise durante sessão dialítica.';
            }
            
            const doseMinTotal = peso * doseMin;
            const doseMaxTotal = peso * doseMax;
            
            return {
                titulo: 'ANEMIA RENAL CRÔNICA',
                dose: `${doseMin.toFixed(0)}-${doseMax.toFixed(0)} U/kg`,
                doseTotal: `${doseMinTotal.toFixed(0)} - ${doseMaxTotal.toFixed(0)} U`,
                frequencia: frequencia,
                observacoes: observacoes,
                alvoHb: ajusteSexo.alvoTerapeutico,
                ajuste: `Reduzir dose em 25% se Hb > 12 g/dL. Suspender se Hb > 13 g/dL. ${ajusteSexo.motivoAjuste}`,
                via: via,
                ajusteSexo: ajusteSexo
            };
        }
        
        function calcularAnemiaCritica(peso, idade, via, situacao, ferro, ajusteSexo) {
            const doseFixa = 40000;
            
            return {
                titulo: 'ANEMIA CRÍTICA (UTI/PACIENTE HOSPITALIZADO)',
                dose: 'ESQUEMA FIXO',
                doseTotal: `${doseFixa.toFixed(0)} U`,
                frequencia: '1 vez por semana',
                observacoes: 'Esquema fixo semanal. Avaliar resposta após 4 semanas.',
                alvoHb: ajusteSexo.alvoTerapeutico,
                ajuste: `SUSPENDER IMEDIATAMENTE se Hb > 12 g/dL. ${ajusteSexo.motivoAjuste}`,
                via: via,
                ajusteSexo: ajusteSexo
            };
        }
        
        function calcularQuimioterapia(peso, idade, via, situacao, ferro, ajusteSexo) {
            const dosePorKg = 150 * ajusteSexo.fatorDose;
            const doseTotal = peso * dosePorKg;
            const doseFixa = 40000;
            
            return {
                titulo: 'ANEMIA EM QUIMIOTERAPIA',
                dose: `${dosePorKg.toFixed(0)} U/kg ou esquema fixo`,
                doseTotal: `${doseTotal.toFixed(0)} U (3x/semana) ou ${doseFixa} U (semanal)`,
                frequencia: '3 vezes por semana ou 1 vez por semana',
                observacoes: 'Iniciar apenas se Hb < 10 g/dL. Suspender após conclusão da quimioterapia.',
                alvoHb: ajusteSexo.alvoTerapeutico,
                ajuste: `Suspender se Hb > 12 g/dL. ${ajusteSexo.motivoAjuste}`,
                via: via,
                ajusteSexo: ajusteSexo
            };
        }
        
        function calcularAnemiaFalciforme(peso, idade, via, situacao, ferro, ajusteSexo) {
            if (situacao === 'crise_aguda') {
                return {
                    titulo: 'DOENÇA FALCIFORME - CRISE AGUDA',
                    dose: 'CONTRAINDICADO',
                    doseTotal: 'NÃO ADMINISTRAR',
                    frequencia: 'NÃO RECOMENDADO',
                    observacoes: '🚨 ALTO RISCO de complicações durante crise vaso-oclusiva aguda',
                    alvoHb: 'NÃO APLICÁVEL',
                    ajuste: 'CONTRAINDICADO durante crise aguda',
                    via: via,
                    alertasEspecificos: [
                        '🚨 CONTRAINDICADO durante crise aguda',
                        '🚨 Risco de síndrome torácica aguda',
                        '🚨 Pode precipitar crise vaso-oclusiva',
                        '💡 Considerar apenas após resolução da crise',
                        '💡 Avaliação hematológica obrigatória'
                    ],
                    contraindicacoes: [
                        'Crise vaso-oclusiva ativa',
                        'Síndrome torácica aguda',
                        'Hb basal > 8 g/dL',
                        'Histórico de trombose recente'
                    ],
                    ajusteSexo: ajusteSexo
                };
            }
            
            const dosePorKg = 125 * ajusteSexo.fatorDose;
            const doseTotal = peso * dosePorKg;
            
            return {
                titulo: 'DOENÇA FALCIFORME (USO RESTRITO)',
                dose: `${(100 * ajusteSexo.fatorDose).toFixed(0)}-${(150 * ajusteSexo.fatorDose).toFixed(0)} U/kg`,
                doseTotal: `${doseTotal.toFixed(0)} U`,
                frequencia: '3 vezes por semana',
                observacoes: 'Adultos: considerar apenas em anemia grave refratária com Hb < 7 g/dL',
                alvoHb: 'NÃO ULTRAPASSAR 10 g/dL',
                ajuste: `SUSPENDER IMEDIATAMENTE se Hb > 10 g/dL. Risco de crise vaso-oclusiva. ${ajusteSexo.motivoAjuste}`,
                via: via,
                alertasEspecificos: [
                    '🚨 ALTO RISCO de crises vaso-oclusivas',
                    '🚨 Pode precipitar síndrome torácica aguda',
                    '🚨 Aumento do risco de trombose',
                    '✅ Considerar apenas quando benefício > risco',
                    '✅ Monitorização HEMATOLÓGICA rigorosa',
                    '💡 Manter hidratação adequada',
                    '💡 Monitorar viscosidade sanguínea'
                ],
                contraindicacoes: [
                    'Hb > 10 g/dL',
                    'Histórico de trombose recente',
                    'Crise vaso-oclusiva frequente',
                    'Síndrome torácica aguda recorrente',
                    'Pacientes com níveis basais de Hb > 8 g/dL'
                ],
                ajusteSexo: ajusteSexo
            };
        }
        
        function exibirResultado(resultado, peso, idade, situacao, aceitaTransfusao, ajusteSexo, viaRecomendacao) {
            const divResultado = document.getElementById('resultado');
            const necessidadeFerro = document.getElementById('ferro').value === 'insuficiente' 
                ? '🚨 REPOSIÇÃO DE FERRO OBRIGATÓRIA antes de iniciar tratamento'
                : '✅ Níveis de ferro adequados para início do tratamento';
            
            let html = `
                <h3>💊 ${resultado.titulo}</h3>
                
                <div class="dose-correta">
                    <h4>📋 Dados do Paciente:</h4>
                    <p><strong>Peso:</strong> ${peso} kg</p>
                    <p><strong>Idade:</strong> ${idade} anos</p>
                    <p><strong>Sexo:</strong> ${document.getElementById('sexo').options[document.getElementById('sexo').selectedIndex].text}</p>
                    <p><strong>Situação:</strong> ${document.getElementById('situacao').options[document.getElementById('situacao').selectedIndex].text}</p>
                    <p><strong>Restrição Transfusional:</strong> ${aceitaTransfusao === 'nao' ? '🚫 NÃO ACEITA TRANSFUSÃO' : '✅ Aceita transfusão'}</p>
                    ${aceitaTransfusao === 'nao' ? `<p><strong>Motivo:</strong> ${document.getElementById('motivoRecusa').options[document.getElementById('motivoRecusa').selectedIndex].text}</p>` : ''}
                </div>
                
                <div class="info-sexo">
                    <h4>🎯 Informações Específicas por Sexo:</h4>
                    <p><strong>Hb Normal de Referência:</strong> ${ajusteSexo.referenciaHb}</p>
                    <p><strong>Alvo Terapêutico:</strong> ${ajusteSexo.alvoTerapeutico}</p>
                    <p><strong>Fator de Ajuste:</strong> ${ajusteSexo.fatorDose}x (${ajusteSexo.motivoAjuste})</p>
                    <p><strong>Observações:</strong> ${ajusteSexo.observacaoSexo}</p>
                </div>
                
                <div class="via-recomendada">
                    <h4>💉 Recomendação de Via:</h4>
                    <p><strong>Via Recomendada:</strong> ${viaRecomendacao.via}</p>
                    <p><strong>Justificativa:</strong> ${viaRecomendacao.justificativa}</p>
                    <p><strong>Frequência:</strong> ${viaRecomendacao.frequencia}</p>
                    <p><strong>Observações:</strong> ${viaRecomendacao.observacao}</p>
                </div>`;
            
            if (ajusteSexo.consideracoesEspeciais) {
                html += `
                <div class="alerta">
                    <h4>💡 Considerações Específicas:</h4>
                    <ul>`;
                ajusteSexo.consideracoesEspeciais.forEach(item => {
                    html += `<li>${item}</li>`;
                });
                html += `</ul>
                </div>`;
            }
            
            if (resultado.dose !== 'CONTRAINDICADO') {
                html += `
                <div class="dose-correta">
                    <h4>💊 Posologia Recomendada:</h4>
                    <p><strong>Dose:</strong> ${resultado.dose}</p>
                    <p><strong>Dose Total:</strong> ${resultado.doseTotal}</p>
                    <p><strong>Frequência:</strong> ${resultado.frequencia}</p>
                    <p><strong>Observações:</strong> ${resultado.observacoes}</p>
                </div>`;
            } else {
                html += `
                <div class="alerta-critico">
                    <h4>🚨 CONTRAINDICAÇÃO ABSOLUTA:</h4>
                    <p><strong>Não administrar eritropoetina durante crise aguda</strong></p>
                    <p><strong>Motivo:</strong> ${resultado.observacoes}</p>
                </div>`;
            }
            
            if (aceitaTransfusao === 'nao') {
                html += `
                <div class="alerta-critico">
                    <h4>🚨 ALERTAS CRÍTICOS - SEM TRANSFUSÃO:</h4>
                    <ul>`;
                resultado.alertasCriticos.forEach(alerta => {
                    html += `<li>${alerta}</li>`;
                });
                html += `</ul>
                </div>
                
                <div class="estrategia">
                    <h4>💡 Estratégias Alternativas:</h4>
                    <ul>`;
                resultado.estrategiasAlternativas.forEach(estrategia => {
                    html += `<li>${estrategia}</li>`;
                });
                html += `</ul>
                </div>
                
                <div class="plano">
                    <h4>📋 Plano de Contingência:</h4>
                    <ul>`;
                resultado.planoContingencia.forEach(item => {
                    html += `<li>${item}</li>`;
                });
                html += `</ul>
                </div>`;
            }
            
            if (resultado.alertasEspecificos) {
                html += `
                <div class="alerta-critico">
                    <h4>⚠️ Alertas Específicos:</h4>
                    <ul>`;
                resultado.alertasEspecificos.forEach(alerta => {
                    html += `<li>${alerta}</li>`;
                });
                html += `</ul>
                </div>`;
            }
            
            html += `
                <div class="alerta">
                    <h4>⚡ Condições e Ajustes:</h4>
                    <p><strong>Alvo de Hemoglobina:</strong> ${resultado.alvoHb}</p>
                    <p><strong>Ajuste de Dose:</strong> ${resultado.ajuste}</p>
                    <p><strong>Status do Ferro:</strong> ${necessidadeFerro}</p>
                </div>
                
                <div class="alerta">
                    <h4>📊 Monitoramento Recomendado:</h4>
                    <ul>
                        <li>Hemograma completo 2x/semana inicialmente</li>
                        <li>Monitorar pressão arterial regularmente</li>
                        <li>Avaliar surgimento de crises dolorosas (falciforme)</li>
                        <li>Monitorar função renal e hepática</li>
                        <li>Ferro sérico e saturação de transferrina</li>
                    </ul>
                </div>
                
                <p><em>💡 Lembrete: Sempre verificar a bula específica do produto e protocolos institucionais.</em></p>`;
            
            divResultado.innerHTML = html;
            divResultado.style.display = 'block';
        }
        
        function preencherExemploCompleto() {
            document.getElementById('peso').value = 68;
            document.getElementById('idade').value = 45;
            document.getElementById('sexo').value = 'mulher';
            document.getElementById('indicacao').value = 'anemia_renal';
            document.getElementById('situacao').value = 'hemodialise';
            document.getElementById('aceitaTransfusao').value = 'sim';
            document.getElementById('via').value = 'intravenosa';
            document.getElementById('ferro').value = 'insuficiente';
            atualizarFormulario();
        }
        
        function limparFormulario() {
            document.getElementById('formEritropoetina').reset();
            document.getElementById('resultado').style.display = 'none';
            atualizarFormulario();
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            atualizarFormulario();
        });
    </script>
</body>
</html>
